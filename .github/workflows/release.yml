# v* 태그를 push 하면 빌드 → Velopack 패키징 → GitHub Release 업로드
#   git tag v1.2.0 && git push origin v1.2.0
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore tools
        run: dotnet tool restore

      # 이전 릴리스 패키지를 받아 두면 vpk pack 이 델타 업데이트를 만듦 (첫 릴리스면 받을 것 없음)
      - name: Download previous release
        run: dotnet vpk download github --repoUrl ${{ github.server_url }}/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} -o dist\releases

      - name: Build and pack
        run: .\build.ps1 -Pack -Version ("${{ github.ref_name }}".TrimStart('v'))

      - name: Upload release
        run: dotnet vpk upload github --repoUrl ${{ github.server_url }}/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} -o dist\releases --publish --releaseName "YTLoader ${{ github.ref_name }}" --tag ${{ github.ref_name }}
